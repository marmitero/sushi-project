<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e2a3f" />
    <title>Sushiventure Idle Tycoon</title>
    <!-- Fontes do kit (Lilita One, Passion One, Bebas Neue) são empacotadas localmente
         via @fontsource (OFL-1.1) e importadas em src/main.ts: funciona offline. -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0e2a3f;
        overflow: hidden;
        -webkit-tap-highlight-color: transparent;
      }
      /* Ocupa a janela inteira. A centralização do canvas é feita SOMENTE pelo Phaser
         (scale.autoCenter = CENTER_BOTH, que aplica margin-left/top no canvas).
         Não usar flex/grid de centralização aqui: somaria com a margem do Phaser e
         deslocaria o canvas (bug "fora de centro" corrigido em 2026-10-12). */
      #game {
        position: fixed;
        inset: 0;
        overflow: hidden;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
